app:
  name: Stocron by RTR
  version: 2.0.3
  debug: false
  offline_mode: false
data_sources:
  priority:
  - yahoo_finance
  - nse_tools
  yahoo_finance:
    enabled: true
    suffix: .NS
    max_retries: 3
    timeout: 30
  nse_tools:
    enabled: true
    max_retries: 3
database:
  type: duckdb
  path: data/db/equity_intelligence.db
  cache_dir: data/cache
cache:
  memory:
    stock_info_max_entries: 2048
    price_history_max_entries: 128
    macro_max_entries: 16
  parquet:
    max_age_hours: 24
    max_total_size_mb: 1024
thresholds:
  governance:
    min_years_listed: 5
    min_promoter_holding: 25.0
    max_pledge_ratio: 20.0
    dividend_consistency_years: 5
    auditor_change_warning_years: 3
  financial:
    min_revenue_cagr_3y: 10.0
    min_revenue_cagr_5y: 8.0
    min_roce: 12.0
    min_fcf_yield: 2.0
    min_positive_fcf_years: 5
    min_earnings_quality: 0.6
    max_debt_to_equity: 1.5
  valuation:
    pe_percentile_expensive: 80
    pe_percentile_cheap: 20
    pb_max_growth: 5.0
    pb_max_value: 2.0
  market:
    max_drawdown_threshold: 50.0
    recovery_months_warning: 24
    volatility_high_threshold: 40.0
risk_profiles:
  low:
    max_volatility: 25.0
    min_dividend_yield: 1.5
    min_promoter_holding: 50.0
    max_debt_equity: 0.5
    min_years_profitable: 7
  medium:
    max_volatility: 35.0
    min_dividend_yield: 0.5
    min_promoter_holding: 35.0
    max_debt_equity: 1.0
    min_years_profitable: 5
  high:
    max_volatility: 50.0
    min_dividend_yield: 0.0
    min_promoter_holding: 25.0
    max_debt_equity: 2.0
    min_years_profitable: 3
signals:
  weights:
    governance: 0.25
    financial: 0.3
    valuation: 0.25
    market_behaviour: 0.15
    ml_context: 0.05
  buy_threshold: 70
  hold_threshold: 50
  avoid_threshold: 30
red_flags:
  auditor_resignation:
    severity: high
    penalty: 20
  promoter_pledge_increase:
    threshold: 10.0
    severity: high
    penalty: 15
  promoter_stake_reduction:
    threshold: 5.0
    severity: medium
    penalty: 10
  earnings_without_cash:
    threshold: 0.5
    severity: high
    penalty: 20
  negative_fcf_streak:
    years: 3
    severity: medium
    penalty: 15
ml_config:
  enabled: true
  auto_initialize: true
  models_dir: models
  device: auto
  forecaster:
    model: chronos-t5-base
    horizon_days: 30
    num_samples: 100
  classifier:
    model: lightgbm
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    min_samples_for_training: 100
    use_walk_forward: true
    walk_forward_splits: 5
    use_risk_adjusted_target: true
  explainer:
    model: null
    context_length: 2048
    temperature: 0.7
    use_shap: true
  ensemble:
    use_two_layer: true
  ml_weight_in_composite: 0.15
  features:
    include_technical: true
    include_forecast: true
    include_macro: true
  model_type: xgboost
  n_clusters: 8
  min_samples_for_training: 100
macro_config:
  enabled: true
  cache_dir: data/macro
  sources:
    repo_rate: rbi_dbie
    usdinr: yahoo_finance
    crude_oil: fred_api
  rsi_thresholds:
    bull:
      oversold: 40
      overbought: 80
    bear:
      oversold: 20
      overbought: 60
    sideways:
      oversold: 30
      overbought: 70
survivorship_bias:
  enabled: true
  include_delisted: true
  delisted_data_dir: data/delisted
inflation_adjustment:
  enabled: true
  use_log_returns: true
  use_cpi_adjustment: true
time_travel:
  min_year: 2005
  available_cutoffs:
  - 2010
  - 2015
  - 2018
  - 2020
  - 2022
ui:
  theme: dark
  charts_height: 400
  default_holding_tenure: 5
  default_expected_return: 15.0
