x-stocron-base: &stocron-base
  build:
    context: .
    dockerfile: Dockerfile
  ports:
    - "8501:8501"
  volumes:
    # IMPORTANT: Mount data directory for offline operation
    - ./data:/app/data
    # Mount config for easy editing (writable for ML setup)
    - ./config:/app/config
    # Persist downloaded ML models
    - ./models:/app/models
  environment:
    - STREAMLIT_SERVER_PORT=8501
    - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    # Optional: Set device manually if auto-detection fails
    # - DEVICE=cuda  # Uncomment to force CUDA
  restart: unless-stopped
  # Note: Network not needed if using pre-downloaded data
  # network_mode: "none"  # Uncomment for true offline mode
  healthcheck:
    test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s

services:
  stocron:
    <<: *stocron-base
    container_name: stocron-by-rtr
    
    # GPU CONFIGURATION (Linux/Windows with NVIDIA)
    # Uncomment the 'deploy' section below to enable GPU acceleration.
    # This requires NVIDIA Container Toolkit on the host.
    # On Mac (Apple Silicon), leave this commented out (runs on CPU).
    
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
